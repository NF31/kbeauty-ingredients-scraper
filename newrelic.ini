# Configuration de l'agent APM New Relic pour le job de scraping.
#
# Charge par `newrelic-admin run-program` (voir ENTRYPOINT du Dockerfile) via
# la variable NEW_RELIC_CONFIG_FILE=/app/newrelic.ini. Seuls les reglages
# specifiques au projet sont listes ici ; tout le reste garde les valeurs par
# defaut de l'agent (cf. doc "Python agent configuration").
#
# Le job tourne dans le meme compte New Relic (region EU, one.eu.newrelic.com)
# que kbeauty-ai-core-service. Il apparait comme une 2e entite APM,
# "kbeauty-ingredients-scraper", de type "non-web" (transaction de fond : le
# conteneur execute un crawl puis s'arrete, ce n'est pas un serveur).

[newrelic]

# Cle de licence : volontairement absente de ce fichier. L'agent la lit dans
# la variable d'environnement NEW_RELIC_LICENSE_KEY (secret du Container App
# Job Azure, comme ASTRA_TOKEN / VOYAGE_API_KEY). Un reglage present dans le
# .ini a priorite sur l'environnement et le .ini ne fait PAS d'interpolation
# ${...} - la laisser ici en dur serait le seul moyen, donc on ne la met pas.
app_name = kbeauty-ingredients-scraper

# Compte EU : le collecteur n'est pas celui par defaut (US). On le fixe
# explicitement plutot que de dependre de l'auto-detection par prefixe de
# cle - meme choix que le reglage NEW_RELIC_HOST cote agent Java.
host = collector.eu01.nr-data.net

# Traçage distribue actif : si un jour le scraper publie vers RabbitMQ ou
# appelle kbeauty-ai-core, les spans seront relies automatiquement. Sans
# effet tant que le job reste isole (ecriture Astra uniquement).
distributed_tracing.enabled = true

# Le job est bref (quelques minutes) : sans transaction de fond explicite,
# l'agent n'enregistrerait rien. L'extension Scrapy NewRelicJobExtension
# ouvre une BackgroundTask pour toute la duree du crawl (voir
# ingredients_scraper/newrelic_extension.py).
transaction_tracer.enabled = true
transaction_tracer.transaction_threshold = apdex_f

# Traces d'erreur remontees (exceptions non catchees dans un callback,
# echec pipeline Cassandra...).
error_collector.enabled = true

# Metriques de volume de logs par niveau (WARNING/ERROR/...) visibles sur la
# page de l'entite. Le *forwarding* des lignes de log est laisse desactive :
# il passe par un endpoint OTLP qui n'est pas auto-resolu pour la region EU
# et les logs du job sont deja consultables dans les logs du Container App
# Job Azure.
application_logging.enabled = true
application_logging.forwarding.enabled = false
application_logging.metrics.enabled = true

# Niveau de log de l'agent lui-meme (fichier stderr du conteneur, visible
# dans les logs du Container App Job). "info" au demarrage pour confirmer la
# connexion ; passer a "warning" une fois stabilise.
log_level = info

[newrelic:development]
monitor_mode = false

[newrelic:production]
monitor_mode = true
