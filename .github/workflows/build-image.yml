name: build-image

on:
  push:
    branches: [main]
    paths:
      - "Dockerfile"
      - "requirements.txt"
      - "newrelic.ini"
      - "ingredients_scraper/**"
      - ".github/workflows/build-image.yml"
  workflow_dispatch: {}

jobs:
  build-push:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # Le bundle Astra (.astra-secrets/) est gitignore : le Dockerfile
      # l'embarque via `COPY . .`, donc il doit exister dans le contexte de
      # build avant docker/build-push-action. Reconstruit ici depuis un
      # secret base64, jamais ecrit ailleurs que dans le workspace ephemere
      # du runner.
      - name: Restaure le bundle Astra
        run: |
          mkdir -p .astra-secrets
          echo "${{ secrets.ASTRA_BUNDLE_B64 }}" | base64 -d > .astra-secrets/secure-connect-kbeauty-ingredients.zip

      - name: Connexion au registre (token scope-map, push uniquement)
        uses: docker/login-action@v3
        with:
          registry: kbeautyscraperacr2734.azurecr.io
          username: ${{ secrets.ACR_USERNAME }}
          password: ${{ secrets.ACR_PASSWORD }}

      - name: Build et push
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          platforms: linux/amd64
          tags: kbeautyscraperacr2734.azurecr.io/kbeauty-ingredients-scraper:latest
